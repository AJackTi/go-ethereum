# Builds the bilingual developer handbook (docs/dev + ARCHITECTURE.md) and publishes it to
# GitHub Pages at https://ajackti.github.io/go-ethereum/
#
# One-time setup in this repository:
#   Settings -> Actions -> General            : allow workflows to run (forks start disabled)
#   Settings -> Pages   -> Build and deployment -> Source: GitHub Actions
name: docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/dev/**'
      - '.tours/**'
      - 'ARCHITECTURE.md'
      - 'CONTRIBUTING.md'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
      # Tour anchors and file references point into the Go code, so a code change can break the
      # handbook. Including Go files here means the breakage surfaces on the PR that caused it.
      - '**.go'
  pull_request:
    paths:
      - 'docs/dev/**'
      - '.tours/**'
      - 'ARCHITECTURE.md'
      - 'CONTRIBUTING.md'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
      # Tour anchors and file references point into the Go code, so a code change can break the
      # handbook. Including Go files here means the breakage surfaces on the PR that caused it.
      - '**.go'
  workflow_dispatch:

permissions:
  contents: read

# Never let two deployments race; queue instead of cancelling so a finished build always ships.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Action majors are kept current so the runner does not fall back to the deprecated Node 20.
      # fetch-depth: 0 gives the git-revision-date plugin the history it needs for "last updated";
      # with a shallow clone every page would silently show the build date instead.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/dev/requirements.txt

      # Runs before the site build and needs no dependencies: it validates the handbook against the
      # code (tour anchors, file references, checkout links, en/vi mirror). A refactor that moves a
      # function fails here instead of silently rotting a walkthrough.
      - name: Check the handbook against the code
        run: python3 docs/dev/check.py

      - name: Install toolchain
        run: pip install -r docs/dev/requirements.txt

      # --strict turns broken internal links and bad config into build failures, so a typo in a
      # link fails the pull request instead of shipping a 404.
      - name: Build site
        run: mkdocs build --strict

      - name: Build offline bundle
        run: OFFLINE=true mkdocs build --strict --site-dir site-offline

      # Downloadable zip of the site that works from file:// — the handbook's own docs promise this
      # on every run, so it is uploaded unconditionally. Safe alongside the Pages artifact because
      # the deploy job below names the artifact it wants explicitly.
      - name: Attach offline bundle to the build
        uses: actions/upload-artifact@v7
        with:
          name: handbook-offline
          path: site-offline
          retention-days: 14

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    # Pull requests build but do not publish.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          # Named explicitly: the build job uploads a second artifact (the offline bundle), and
          # relying on the default would make which one ships depend on upload order.
          artifact_name: github-pages
