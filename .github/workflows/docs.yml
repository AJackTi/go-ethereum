# Builds the bilingual developer handbook (docs/dev + ARCHITECTURE.md) and publishes it to
# GitHub Pages at https://ajackti.github.io/go-ethereum/
#
# One-time setup in this repository:
#   Settings -> Actions -> General            : allow workflows to run (forks start disabled)
#   Settings -> Pages   -> Build and deployment -> Source: GitHub Actions
name: docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/dev/**'
      - 'ARCHITECTURE.md'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/dev/**'
      - 'ARCHITECTURE.md'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# Never let two deployments race; queue instead of cancelling so a finished build always ships.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/dev/requirements.txt

      - name: Install toolchain
        run: pip install -r docs/dev/requirements.txt

      # --strict turns broken internal links and bad config into build failures, so a typo in a
      # link fails the pull request instead of shipping a 404.
      - name: Build site
        run: mkdocs build --strict

      - name: Build offline bundle
        run: OFFLINE=true mkdocs build --strict --site-dir site-offline

      - name: Attach offline bundle to the build
        uses: actions/upload-artifact@v4
        with:
          name: handbook-offline
          path: site-offline
          retention-days: 14

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    # Pull requests build but do not publish.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
