site_name: go-ethereum developer handbook
site_description: >-
  Offline-first, bilingual (EN/VI) guide to reading, navigating and changing the go-ethereum codebase.
site_url: https://ajackti.github.io/go-ethereum/
site_author: AJackTi

repo_url: https://github.com/AJackTi/go-ethereum
repo_name: AJackTi/go-ethereum
edit_uri: edit/master/docs/dev/

docs_dir: docs/dev
site_dir: site

# The handbook is written to be read straight from the working tree. This file only adds a
# published website on top of it; the Markdown files stay the source of truth.
# Build:  mkdocs serve            (local preview)
#         mkdocs build            (site/)
#         OFFLINE=true mkdocs build   (site/ that works from file:// — zip and hand it around)
hooks:
  - docs/dev/_hooks.py

exclude_docs: |
  README.md
  _hooks.py
  check.py
  __pycache__/

# MkDocs logs these at INFO by default, which means `--strict` ignores them: a page left out of the
# nav is built but unreachable, and a link to a heading that was renamed still resolves to the page
# and lands the reader at the top. Raising them to `warn` makes `--strict` fail on both.
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    anchors: warn
    unrecognized_links: warn

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # `:material-rocket-launch:` and friends on the home page are Material icon shortcodes. Without
  # this they render as literal text — the icon set is bundled with the theme, nothing is fetched.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  # The i18n plugin adds `vi` to the search languages automatically, and lunr-languages ships a
  # Vietnamese module (bundled as lunr.vi.min.js) with a Vietnamese trimmer, word-character class
  # and stop-word list. Vietnamese is isolating, so there is no stemming to do — matching is on
  # whole words by design. The separator below is widened to the punctuation these pages actually
  # use (identifiers, paths, backticks) so code-shaped queries tokenise sensibly in both languages.
  - search:
      separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;'
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: vi
          name: Tiếng Việt
          build: true
          # Only the section headings need translating — page titles come from each language's own
          # H1, so a Vietnamese page already carries its Vietnamese title.
          nav_translations:
            First steps: Bước đầu
            Understand the code: Hiểu codebase
            Change the code: Sửa codebase
            Run and build on it: Vận hành và xây trên nó
            Decisions (ADR): Quyết định (ADR)
  # "Last updated" per page, taken from git history. CI must check out with fetch-depth: 0,
  # otherwise every page falls back to the build date.
  - git-revision-date-localized:
      type: date
      enable_creation_date: false
      fallback_to_build_date: true
      enabled: !ENV [GIT_DATES, true]

  # Enabled only for the offline bundle: moves the search index into a JS file so the site
  # also works when opened directly from disk.
  - offline:
      enabled: !ENV [OFFLINE, false]

nav:
  - index.md
  - First steps:
      - getting-started.md
      - glossary.md
  - Understand the code:
      - architecture.md
      - learning-path.md
  - Change the code:
      - start-here.md
      - debugging.md
  - Run and build on it:
      - run-a-node.md
      - using-geth.md
      - tools.md
      - subsystems.md
  - Decisions (ADR):
      - adr/index.md
      - adr/0001-record-architecture-decisions.md
      - adr/0002-offline-first-bilingual-dev-docs.md
      - adr/0003-publish-handbook-to-github-pages.md
      - adr/0004-validate-the-handbook-in-ci.md
      - adr/0000-template.md

extra:
  # extra.alternate (the language switcher) is generated per page by the i18n plugin — setting it
  # by hand here would only produce links that ignore which page the reader is on.
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AJackTi/go-ethereum
